<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Build Your Bear!</title>
  <style>
    :root { --ink:#30234b; --pink:#ff5e9a; --yellow:#ffe15a; --mint:#74e4c4; }
    *{box-sizing:border-box} body{margin:0;min-width:900px;background:linear-gradient(135deg,#b7efff,#ffd7e9 52%,#fff1a4);color:var(--ink);font-family:"Arial Rounded MT Bold",system-ui,sans-serif}
    button{font:inherit;font-weight:900;color:var(--ink);cursor:pointer}button:focus-visible{outline:4px solid #1677ff;outline-offset:3px}
    .app{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.logo{font-size:2rem;letter-spacing:-.06em}.logo span{display:inline-grid;place-items:center;width:53px;height:53px;background:var(--yellow);border:3px solid var(--ink);border-radius:50%;box-shadow:4px 4px 0 var(--ink);transform:rotate(-7deg)}.chip{padding:10px 16px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink)}
    main{display:grid;grid-template-columns:minmax(470px,1fr) 420px;gap:23px}.card{border:4px solid var(--ink);border-radius:28px;background:#fffdf8;box-shadow:8px 8px 0 var(--ink);overflow:hidden}.stage{padding:20px;min-height:650px}.stage-head{display:flex;justify-content:space-between;align-items:center}.stage h1{margin:0;font-size:1.65rem}.compliment{padding:9px 12px;background:var(--yellow);border:3px solid var(--ink);border-radius:15px;box-shadow:3px 3px 0 var(--ink);font-size:.88rem}
    .scene{position:relative;display:grid;place-items:center;min-height:500px;margin-top:13px;overflow:hidden;border:3px dashed var(--ink);border-radius:23px}.scene[data-bg="candy"]{background:radial-gradient(circle at 16% 18%,#fff 0 7px,transparent 8px),linear-gradient(135deg,#ff82bb,#9e81ff)}.scene[data-bg="sun"]{background:radial-gradient(circle at 80% 18%,#fff29a 0 48px,transparent 50px),linear-gradient(#87e1ff 0 62%,#8de39d 63%)}.scene[data-bg="disco"]{background:radial-gradient(circle,#fff6a0 0 3px,transparent 4px),linear-gradient(135deg,#2b155b,#8b2dbc 57%,#fb508c);background-size:30px 30px,auto}.scene[data-bg="cloud"]{background:radial-gradient(ellipse at 18% 80%,#fff 0 42px,transparent 44px),linear-gradient(#91eaff,#d6faff)}.floor{position:absolute;bottom:0;width:100%;height:70px;background:#ffffffc7;border-top:3px solid var(--ink)}.deco{position:absolute;font-size:2.3rem;animation:bob 2s ease-in-out infinite alternate}.d1{top:38px;left:40px}.d2{top:74px;right:42px;animation-delay:.6s}.d3{bottom:80px;left:54px;animation-delay:1s}
    .bear-wrap{position:relative;width:286px;height:390px;z-index:2;transform-origin:bottom center}.bear-wrap[data-pose="bounce"]{animation:dance .8s ease-in-out infinite alternate}.bear{position:absolute;inset:42px 20px 12px;border:4px solid var(--ink);border-radius:47% 47% 40% 40%;background:var(--fur);box-shadow:inset -12px -10px #00000013}.bear:before,.bear:after{content:"";position:absolute;top:-48px;width:88px;height:88px;background:var(--fur);border:4px solid var(--ink);border-radius:50%;z-index:-1}.bear:before{left:8px}.bear:after{right:8px}.bear[data-bear="bubble"]{--fur:#f4b261;--muzzle:#ffe2bc}.bear[data-bear="sprinkle"]{--fur:#ffb8d3;--muzzle:#fff1f7}.bear[data-bear="mocha"]{--fur:#87513f;--muzzle:#d9a08d}.face{position:absolute;top:38px;left:50%;width:165px;height:140px;border:4px solid var(--ink);border-radius:48%;background:var(--muzzle);transform:translateX(-50%)}.eye{position:absolute;top:41px;width:15px;height:23px;background:var(--ink);border-radius:50%}.eye:first-child{left:39px}.eye:nth-child(2){right:39px}.cheek{position:absolute;top:77px;width:27px;height:13px;background:#ff86aa;border-radius:50%}.cheek:nth-child(3){left:21px}.cheek:nth-child(4){right:21px}.snout{position:absolute;top:67px;left:50%;width:57px;height:45px;border:3px solid var(--ink);border-radius:45%;background:var(--muzzle);transform:translateX(-50%)}.nose{position:absolute;top:8px;left:18px;width:20px;height:14px;background:var(--ink);border-radius:50%}.mouth{position:absolute;top:22px;left:14px;width:27px;height:14px;border-bottom:3px solid var(--ink);border-radius:50%}.arm{position:absolute;top:185px;width:70px;height:145px;background:var(--fur);border:4px solid var(--ink);border-radius:50%}.arm.l{left:-30px;transform:rotate(22deg)}.arm.r{right:-30px;transform:rotate(-22deg)}.bear-wrap[data-pose="wave"] .arm.r{animation:wave .45s ease-in-out infinite alternate;transform-origin:bottom}.paw{position:absolute;bottom:-18px;width:85px;height:60px;background:var(--fur);border:4px solid var(--ink);border-radius:48%}.paw.l{left:34px}.paw.r{right:34px}
    .layer{position:absolute;left:50%;z-index:3;pointer-events:none;transform:translateX(-50%);font-size:4.4rem;line-height:1;white-space:nowrap;filter:drop-shadow(2px 3px #30234b59)}.hat{top:0}.glasses{top:98px;font-size:3.25rem}.topwear{top:164px;font-size:5rem}.costume{top:140px;font-size:8.7rem}.hand{top:235px;left:77%;font-size:3.9rem}.empty{display:none}.burst{position:absolute;z-index:5;top:40%;left:50%;font-size:2rem;pointer-events:none;animation:burst .65s ease-out forwards}
    .controls{display:flex;justify-content:center;gap:9px;margin-top:16px}.small,.finish{border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:10px 13px;background:#fff}.finish{background:var(--pink);color:#fff}.small:hover,.finish:hover,.option:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
    .closet{padding:20px}.closet h2{margin:0;font-size:1.5rem}.sub{margin:5px 0 0;color:#675c77;font-size:.94rem}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.tab{min-height:61px;border:3px solid var(--ink);border-radius:15px;background:#f3edff;font-size:1.65rem;box-shadow:2px 2px 0 var(--ink)}.tab[aria-selected="true"]{background:var(--yellow);box-shadow:4px 4px 0 var(--ink);transform:translate(-1px,-1px)}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:167px}.option{min-height:112px;border:3px solid var(--ink);border-radius:18px;background:#fff6fa;box-shadow:3px 3px 0 var(--ink);font-size:2.7rem}.option span{display:block;margin-top:5px;font-size:.68rem}.option.selected{background:var(--mint)}.label{margin-top:16px;font-size:.88rem;font-weight:900}.picker{display:flex;gap:8px;margin-top:7px}.pick{flex:1;min-height:51px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:1.4rem;box-shadow:2px 2px 0 var(--ink)}.pick.selected{background:var(--yellow)}.done{width:100%;margin-top:19px;padding:15px;border:4px solid var(--ink);border-radius:18px;background:var(--pink);color:white;font-size:1.2rem;box-shadow:5px 5px 0 var(--ink)}
    .modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:30px;background:#30234bab}.modal.show{display:grid}.photo{width:min(620px,90vw);padding:20px;border:5px solid var(--ink);border-radius:30px;background:#fff;box-shadow:10px 10px 0 var(--ink);text-align:center;animation:pop .35s ease}.photo h2{margin:0;font-size:2rem}.photo p{margin:6px 0}.photo .scene{min-height:360px;margin:15px 0}.photo .bear-wrap{transform:scale(.83);margin:-5px auto -55px}.photo .bear-wrap[data-pose="bounce"]{animation:none}
    @keyframes bob{to{transform:translateY(-12px) rotate(9deg)}}@keyframes dance{to{transform:translateY(-12px) rotate(3deg)}}@keyframes wave{to{transform:rotate(-55deg)}}@keyframes pop{0%{transform:scale(.7);opacity:0}75%{transform:scale(1.05)}to{transform:scale(1);opacity:1}}@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(-50%,-160%) scale(2.2);opacity:0}}@media(max-width:960px){body{min-width:0}.app{padding:16px}main{grid-template-columns:1fr}.stage{min-height:620px}}
  </style>
</head>
<body>
  <div class="app"><header class="top"><div class="logo"><span>🧸</span> Build Your Bear!</div><div class="chip">✨ Make it sparkle!</div></header>
  <main><section class="stage card" aria-label="Your bear's dressing room"><div class="stage-head"><h1>Dress up time!</h1><div class="compliment" id="compliment" aria-live="polite">Pick something fun!</div></div>
    <div class="scene" id="scene" data-bg="candy"><span class="deco d1">⭐</span><span class="deco d2">💖</span><span class="deco d3">✨</span><div class="floor"></div><div class="bear-wrap" id="bearWrap" data-pose="bounce" aria-label="Your dressed-up bear"><div class="layer hat empty" id="hat"></div><div class="layer glasses empty" id="glasses"></div><div class="layer topwear empty" id="topwear"></div><div class="layer costume empty" id="costume"></div><div class="layer hand empty" id="hand"></div><div class="bear" id="bear" data-bear="bubble"><span class="arm l"></span><span class="arm r"></span><span class="paw l"></span><span class="paw r"></span><div class="face"><span class="eye"></span><span class="eye"></span><span class="cheek"></span><span class="cheek"></span><span class="snout"><span class="nose"></span><span class="mouth"></span></span></div></div></div></div>
    <div class="controls"><button class="small" id="pose">💃 Change pose</button><button class="small" id="clear">🧼 Clear outfit</button><button class="finish" id="finish">📸 All done!</button></div></section>
  <aside class="closet card" aria-label="Bear wardrobe"><h2>My magic closet</h2><p class="sub">Click a picture to try it on!</p><div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-cat="topwear" title="Tops">👕</button><button class="tab" role="tab" aria-selected="false" data-cat="costume" title="Costumes">🦄</button><button class="tab" role="tab" aria-selected="false" data-cat="hat" title="Hats">🎩</button><button class="tab" role="tab" aria-selected="false" data-cat="glasses" title="Glasses">👓</button><button class="tab" role="tab" aria-selected="false" data-cat="hand" title="Accessories">👜</button><button class="tab" role="tab" aria-selected="false" data-cat="clear-one" title="Take off an item">🧼</button></div><div class="items" id="items" aria-live="polite"></div>
  <div class="label">Pick a bear</div><div class="picker" id="bears"><button class="pick selected" data-bear="bubble" aria-label="Golden bear">🧸</button><button class="pick" data-bear="sprinkle" aria-label="Pink bear">🐻</button><button class="pick" data-bear="mocha" aria-label="Brown bear">🤎</button></div><div class="label">Pick a playroom</div><div class="picker" id="backgrounds"><button class="pick selected" data-bg="candy" aria-label="Candy room">🍭</button><button class="pick" data-bg="sun" aria-label="Sunny park">☀️</button><button class="pick" data-bg="disco" aria-label="Disco party">🪩</button><button class="pick" data-bg="cloud" aria-label="Cloud room">☁️</button></div><button class="done" id="done">✨ I'm all done! ✨</button></aside></main></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="photo-title"><div class="photo"><h2 id="photo-title">Ta-da! You did it!</h2><p>Your bear is ready for a fashion photo! 🌟</p><div class="scene" id="photoScene"><span class="deco d1">⭐</span><span class="deco d2">💖</span><div class="floor"></div><div id="photoBear"></div></div><button class="finish" id="again">🎀 Dress up more!</button></div></div>
  <script>
    const wardrobe={topwear:[['👕','Rainbow tee'],['🧥','Cool jacket'],['👚','Pink top']],costume:[['🦄','Unicorn'],['🧚','Fairy'],['🦸','Superhero']],hat:[['🎩','Top hat'],['👑','Crown'],['🧢','Cap']],glasses:[['😎','Cool shades'],['🤓','Funny glasses'],['🥸','Silly disguise']],hand:[['👜','Handbag'],['🎈','Balloon'],['🪄','Magic wand']]};
    const state={bear:'bubble',bg:'candy',pose:'bounce',topwear:'',costume:'',hat:'',glasses:'',hand:''};let active='topwear';
    const items=document.querySelector('#items'),say=document.querySelector('#compliment'),nice=['So stylish!','Wow, sparkly!','Super cute!','Ta-da!','Amazing choice!'];
    const scene=document.querySelector('#scene'),bear=document.querySelector('#bear'),bearWrap=document.querySelector('#bearWrap'),clearBtn=document.querySelector('#clear'),poseBtn=document.querySelector('#pose'),doneBtn=document.querySelector('#done'),finishBtn=document.querySelector('#finish'),modal=document.querySelector('#modal'),again=document.querySelector('#again'),photoBear=document.querySelector('#photoBear'),photoScene=document.querySelector('#photoScene');
    const cheer=()=>{say.textContent=nice[Math.floor(Math.random()*nice.length)];say.animate([{transform:'scale(.7)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:350})};
    const spark=()=>{let s=document.createElement('span');s.className='burst';s.textContent='✨ 💖 ⭐';scene.append(s);setTimeout(()=>s.remove(),700)};
    function layers(){for(const k of Object.keys(wardrobe)){let el=document.querySelector('#'+k);el.textContent=state[k];el.classList.toggle('empty',!state[k])}}
    function render(){items.innerHTML='';if(active==='clear-one'){Object.keys(wardrobe).forEach(k=>add('🧼','Clear '+k,()=>{state[k]='';layers();render();cheer()}));return}wardrobe[active].forEach(([icon,name])=>add(icon,name,()=>{if(active==='costume')state.topwear='';if(active==='topwear')state.costume='';state[active]=icon;layers();render();spark();cheer()},state[active]===icon))}
    function add(icon,name,fn,selected=false){let b=document.createElement('button');b.className='option'+(selected?' selected':'');b.innerHTML=icon+'<span>'+name+'</span>';b.setAttribute('aria-label',name);b.onclick=fn;items.append(b)}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
    document.querySelectorAll('#bears button').forEach(b=>b.onclick=()=>{state.bear=b.dataset.bear;bear.dataset.bear=state.bear;document.querySelectorAll('#bears button').forEach(x=>x.classList.toggle('selected',x===b));spark();cheer()});
    document.querySelectorAll('#backgrounds button').forEach(b=>b.onclick=()=>{state.bg=b.dataset.bg;scene.dataset.bg=state.bg;document.querySelectorAll('#backgrounds button').forEach(x=>x.classList.toggle('selected',x===b));cheer()});
    clearBtn.onclick=()=>{Object.keys(wardrobe).forEach(k=>state[k]='');layers();render();say.textContent='Fresh and ready!'};poseBtn.onclick=()=>{state.pose=state.pose==='bounce'?'wave':'bounce';bearWrap.dataset.pose=state.pose;cheer()};
    function finish(){let copy=bearWrap.cloneNode(true);copy.removeAttribute('id');photoBear.replaceChildren(copy);photoScene.dataset.bg=state.bg;modal.classList.add('show');again.focus()}doneBtn.onclick=finish;finishBtn.onclick=finish;again.onclick=()=>{modal.classList.remove('show');finishBtn.focus()};
    render();
  </script>
</body>
</html>
